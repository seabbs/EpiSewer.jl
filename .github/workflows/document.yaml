#
# EPIAWARE_MANAGED_OVERRIDE: kept package-owned for the `with:` block below.
# The kit renders that block from its `docs_timeout` input alone, so a resync
# would drop `julia_num_threads` and silently halve the docs fit's chains.
# Drop this marker once the kit exposes a threads input:
# EpiAware/EpiAwarePackageTools.jl#474.
name: Documenter

on:
  push:
    branches: main
    tags: '*'
  pull_request:
  merge_group:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Documenter:
    # The reusable documentation workflow deploys to gh-pages and opens a
    # preview PR, so it needs write scopes. This repo's default workflow
    # permissions are read-only, so the caller grants them explicitly.
    # NOTE: `EpiAwarePackageTools.update` regenerates this file and may drop
    # this block (scaffold templates don't emit caller permissions); re-apply
    # if the Documenter job starts failing with a permissions error.
    permissions:
      contents: write
      statuses: write
      pull-requests: write
    # The README's worked example fits the model inside the docs build, so the
    # build is dominated by sampling rather than by rendering: about 25 minutes
    # locally at the committed settings and longer on a CI runner. The reusable
    # workflow defaults to 45, which this can exceed. The README fit uses
    # EpiSewer's own sampler settings — four chains at 500 warmup and 500
    # sampling, tree depth 15 — which at the measured cost of about 6.6 seconds
    # an iteration is close to two hours of sampling before the rest of the
    # build. The kit emits this block from its `docs_timeout` input, between
    # `uses:` and `secrets:` — the position kept here, so a resync produces no
    # drift. `template-sync.yaml` passes `docs_timeout` to match.
    uses: EpiAware/.github/.github/workflows/documentation.yml@b96a45c468c1d80a29334426a1a4f3b0c04bea7e
    with:
      timeout_minutes: 300
      # `ubuntu-latest` gives four vCPUs and the reusable workflow defaults
      # this to 1, so `MCMCThreads()` in the README fit was running its chains
      # one after another. Four threads runs four chains in the wall-clock time
      # of one, which buys a better R-hat estimate for nothing. The kit emits
      # only `timeout_minutes` into this block, so a resync would drop this —
      # hence the override marker above.
      julia_num_threads: 4
    secrets: inherit  # pragma: allowlist secret
