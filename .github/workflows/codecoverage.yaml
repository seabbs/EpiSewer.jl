# MANAGED by EpiAwarePackageTools.scaffold — do not edit by hand.
name: Code coverage

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    uses: EpiAware/.github/.github/workflows/coverage.yml@ce7c6223533f472468f94619907281c205c4b870
    with:
      julia_version: '1'
      # Hard-fail the coverage check on an upload error: a repo with no
      # CODECOV_TOKEN cannot upload on a protected branch, so CI goes red as
      # a reminder to add the secret (repo or org).
      fail_ci_if_error: true
    # Passed explicitly rather than by `secrets: inherit`. With `inherit` the
    # reusable workflow saw an empty token ("Token length: 0") even with the
    # repository secret set, and Codecov rejects a tokenless upload on a
    # protected branch. Naming it makes the propagation unambiguous.
    # NOTE: `EpiAwarePackageTools.update` regenerates this file and may restore
    # `secrets: inherit`; re-apply if coverage starts failing on the token again.
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  # pragma: allowlist secret
